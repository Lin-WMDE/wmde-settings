[workspace]
members = ["cosmic-settings", "page", "pages/*", "subscriptions/*"]
default-members = ["cosmic-settings"]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[workspace.dependencies]
cosmic-randr = { git = "https://github.com/pop-os/cosmic-randr" }
tokio = { version = "1.49.0", features = ["macros"] }
iced_winit = { git = "https://github.com/pop-os/libcosmic", default-features = false }

[workspace.dependencies.libcosmic]
features = [
    "dbus-config",
    "desktop",
    "multi-window",
    "winit",
    "tokio",
    "qr_code",
]
git = "https://github.com/pop-os/libcosmic"

[workspace.dependencies.cosmic-config]
git = "https://github.com/pop-os/libcosmic"

# wmde-bg renamed its config crate to `wmde-bg-config` (ships the `fun.wmde.Background`
# id); alias it back to the `cosmic-bg-config` dependency key so every `cosmic_bg_config::`
# import keeps resolving while reading/writing the WMDE background namespace.
[workspace.dependencies.cosmic-bg-config]
package = "wmde-bg-config"
path = "../wmde-bg/config"

[workspace.dependencies.cosmic-comp-config]
git = "https://github.com/pop-os/cosmic-comp"
features = ["output"]

[workspace.dependencies.cosmic-idle-config]
git = "https://github.com/pop-os/cosmic-idle"

[workspace.dependencies.cosmic-panel-config]
git = "https://github.com/pop-os/cosmic-panel"

[workspace.dependencies.cosmic-randr-shell]
git = "https://github.com/pop-os/cosmic-randr"

[workspace.dependencies.sctk]
version = "0.20"
package = "smithay-client-toolkit"

[profile.dev]
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
lto = "off"
debug = true

# [patch.'https://github.com/pop-os/cosmic-text']
# cosmic-text = { git = "https://github.com/pop-os/cosmic-text//", rev = "b017d7c" }

[patch.'https://github.com/pop-os/cosmic-protocols']
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }

# Consume the WMDE forks of the shared settings-daemon config/audio crates so the
# repointed cross-component ids (fun.wmde.SettingsDaemon, fun.wmde.Settings.Shortcuts,
# varlink fun.wmde.Settings/.Audio) resolve through the fork's constants (A.6).
[patch.'https://github.com/pop-os/cosmic-settings-daemon']
cosmic-settings-config = { path = "../wmde-settings-daemon/config" }
cosmic-settings-daemon-config = { path = "../wmde-settings-daemon/cosmic-settings-daemon-config" }
cosmic-settings-audio-client = { path = "../wmde-settings-daemon/audio-client" }

# Compositor config crate (fun.wmde.Comp) - keep the original crate name/dir, local path.
[patch.'https://github.com/pop-os/cosmic-comp']
cosmic-comp-config = { path = "../wmde-comp/cosmic-comp-config" }

# Panel config crate (fun.wmde.Panel*) - original crate name/dir, local path.
[patch.'https://github.com/pop-os/cosmic-panel']
cosmic-panel-config = { path = "../wmde-panel/cosmic-panel-config" }

# libcosmic / cosmic-config / cosmic-theme / iced family -> local WMDE fork.
# Pinning the whole family here retires the git-vs-path double-resolution in Cargo.lock.
[patch.'https://github.com/pop-os/libcosmic']
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

[patch.crates-io]
atspi = { git = "https://github.com/wash2/atspi" }
atspi-common = { git = "https://github.com/wash2/atspi" }

# WMDE: redirect the last upstream pop-os/cosmic-randr git dep to the local wmde-randr
# fork (crate names kept - only the CLI binary is renamed). Both URL forms because the
# consumers declare the dep with and without a trailing slash; the shell crate pulls the
# lib crate transitively from the same git source, so both are patched.
[patch."https://github.com/pop-os/cosmic-randr"]
cosmic-randr = { path = "../wmde-randr/lib" }
cosmic-randr-shell = { path = "../wmde-randr/shell" }

[patch."https://github.com/pop-os/cosmic-randr/"]
cosmic-randr = { path = "../wmde-randr/lib" }
cosmic-randr-shell = { path = "../wmde-randr/shell" }
